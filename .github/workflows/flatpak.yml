name: Flatpak

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # attach the bundle to tagged releases

jobs:
  flatpak:
    name: Build the Flatpak bundle
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: Sapphire.flatpak
          manifest-path: packaging/flatpak/io.github.snowberrifox.Sapphire.yml
          cache-key: flatpak-builder-${{ hashFiles('packaging/flatpak/python-deps.json') }}
      - name: Self-test inside the Flatpak
        shell: bash
        run: |
          set +e
          {
            flatpak install --system -y --noninteractive Sapphire.flatpak &&
            flatpak info io.github.snowberrifox.Sapphire &&
            flatpak run --env=QT_QPA_PLATFORM=offscreen io.github.snowberrifox.Sapphire --selftest
          } > selftest.txt 2>&1
          code=$?
          cat selftest.txt
          # the result as an annotation too, so it can be read without the raw log
          msg=$(grep -v '^\s*$' selftest.txt | tail -n 25 | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          if [ $code -ne 0 ]; then echo "::error title=Self-test failed::$msg"; else echo "::notice title=Self-test passed::$msg"; fi
          exit $code
      - name: Release notes from CHANGELOG.md
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## "v" " {f=1; next} /^## / {if (f) exit} f' CHANGELOG.md > notes.md
          printf '\n**Flatpak:** download `Sapphire.flatpak` below, then `flatpak install --user Sapphire.flatpak`. Installs made with `install.sh` update themselves as before.\n' >> notes.md
          cat notes.md
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Sapphire ${{ github.ref_name }}
          body_path: notes.md
          files: Sapphire.flatpak
