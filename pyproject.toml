[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sapphire"
version = "1.6.0"
description = "A fast, reliable Deadlock mod manager for Linux that pulls mods live from GameBanana"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6-Essentials>=6.6",
    "PySide6-Addons>=6.6",          # QtMultimedia (sound previews)
    "requests>=2.31",
    "py7zr>=0.21",
    "rarfile>=4.1",
    "lz4>=4.3",
    "zstandard>=0.22",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sapphire = "sapphire.__main__:_main"

[tool.setuptools]
packages = ["sapphire", "sapphire.ui"]

[tool.setuptools.package-data]
sapphire = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
